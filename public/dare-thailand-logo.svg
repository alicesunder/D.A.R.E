<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="100%" height="100%">
  <defs>
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <linearGradient id="whiteRibbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FDFDFE" />
      <stop offset="100%" stop-color="#EDEDF2" />
    </linearGradient>
    <linearGradient id="innerFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#801018" />
      <stop offset="50%" stop-color="#B81420" />
      <stop offset="100%" stop-color="#E01E2B" />
    </linearGradient>
  </defs>

  <!-- 1. BACK FOLD OF THAI FLAG (Top Left) -->
  <g id="thaiFlagBack">
    <!-- Red Top Stripe -->
    <path d="M 45 130 C 45 70, 100 25, 230 25 C 275 25, 315 45, 330 90 C 295 80, 245 80, 215 95 C 130 95, 80 115, 45 130 Z" fill="#D61C27" />
    <!-- White Stripe 1 -->
    <path d="M 42 165 C 50 120, 110 50, 230 50 C 285 50, 310 75, 325 105 C 285 92, 230 90, 195 105 C 120 105, 75 140, 42 165 Z" fill="#FFFFFF" />
    <!-- Blue Center Stripe (Broad) -->
    <path d="M 38 215 C 45 170, 95 90, 220 90 C 275 90, 305 105, 318 125 C 265 110, 210 115, 175 130 C 105 130, 65 185, 38 215 Z" fill="#1C2B78" />
    <!-- White Stripe 2 -->
    <path d="M 34 245 C 40 210, 80 145, 185 145 C 235 145, 275 150, 295 160 C 245 145, 190 145, 155 165 C 95 165, 55 220, 34 245 Z" fill="#FFFFFF" />
    <!-- Red Bottom Stripe -->
    <path d="M 30 270 C 35 240, 70 185, 155 185 C 200 185, 245 185, 265 190 C 220 180, 170 180, 135 200 C 75 205, 45 255, 30 270 Z" fill="#D61C27" />
  </g>

  <!-- 2. RIBBON 3D INNER ROLL / LOOP -->
  <g id="ribbonLoop">
    <!-- Inner roll shadow/gradient -->
    <path d="M 330 90 C 330 115, 315 135, 275 150 C 235 165, 185 170, 130 170 C 120 170, 115 165, 125 150 C 150 115, 210 95, 290 85 C 315 82, 330 85, 330 90 Z" fill="url(#innerFold)" />
    <!-- Inner white flap -->
    <path d="M 315 105 C 315 125, 280 145, 225 158 C 170 170, 140 172, 125 172 C 120 172, 118 168, 124 158 C 145 125, 195 108, 270 98 C 295 95, 310 100, 315 105 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 3. MAIN FOREGROUND WHITE SCROLL / BANNER -->
  <g id="mainBanner" filter="url(#shadowFilter)">
    <!-- Main White Banner Body -->
    <path d="M 125 120 
             C 170 100, 235 90, 310 95 
             C 385 100, 460 115, 505 105 
             C 505 155, 495 210, 485 248 
             C 435 255, 350 250, 255 272 
             C 185 288, 135 295, 118 290 
             C 112 288, 118 260, 125 210 
             Z" 
          fill="url(#whiteRibbonGrad)" 
          stroke="#EAEAEA" 
          stroke-width="1.5" />

    <!-- Top Red Trim Ribbon -->
    <path d="M 125 120 
             C 170 100, 235 90, 310 95 
             C 385 100, 460 115, 505 105 
             L 508 122 
             C 460 130, 385 116, 310 111 
             C 235 106, 170 116, 125 136 
             Z" 
          fill="#E01E2B" />

    <!-- Bottom Red Trim Ribbon -->
    <path d="M 118 274 
             C 145 278, 195 270, 255 255 
             C 350 232, 435 237, 485 230 
             L 485 250 
             C 435 257, 350 252, 255 275 
             C 185 291, 135 298, 118 292 
             Z" 
          fill="#E01E2B" />
  </g>

  <!-- 4. "D.A.R.E." BRUSH-STYLE RED TEXT WITH BLACK SHADOW -->
  <g id="dareText" filter="url(#textShadow)">
    <!-- Bold distressed italic "D.A.R.E." matching the logo -->
    <text x="185" y="245"
          font-family="'Impact', 'Arial Black', sans-serif"
          font-weight="900"
          font-style="italic"
          font-size="118"
          letter-spacing="5"
          fill="#E01E2B"
          stroke="#900C16"
          stroke-width="2"
          transform="rotate(-5 200 220)">
      D.A.R.E.
    </text>
  </g>

  <!-- 5. "THAILAND" CURVING BLUE TEXT -->
  <g id="thailandText">
    <text x="255" y="268"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900"
          font-size="21"
          letter-spacing="5"
          fill="#1C2B78"
          transform="rotate(-4 255 268)">
      THAILAND
    </text>
  </g>
</svg>
