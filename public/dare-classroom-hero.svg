<g fill="#e5b94e"><path d="M900 90l8 22 22 8-22 8-8 22-8-22-22-8 22-8Z"/><path d="M1510 405l6 16 16 6-16 6-6 16-6-16-16-6 16-6Z"/></g>
<g fill="#8b5cf6" opacity=".5"><circle cx="960" cy="160" r="8"/><circle cx="1480" cy="510" r="6"/><circle cx="920" cy="590" r="5"/></g>
</svg>