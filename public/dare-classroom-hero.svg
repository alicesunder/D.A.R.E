 <path d="M-100 390Q-170 420-170 486L-123 512Q-78 464-52 444" fill="#9baabd" stroke="#7e8da2" stroke-width="8" stroke-linecap="round"/><circle cx="-147" cy="502" r="29" fill="#aab6c7"/>
 <path d="M166 385Q235 408 250 470L210 493Q172 455 130 444" fill="#aab6c7" stroke="#7e8da2" stroke-width="8" stroke-linecap="round"/><circle cx="224" cy="480" r="29" fill="#aab6c7"/>
