 <path d="M-16 318L45 365L99 319L80 402H0Z" fill="#fff"/>
 <path d="M8 363l35 25 29-25" fill="none" stroke="#e4c36d" stroke-width="6" stroke-linecap="round"/>
 <rect x="-95" y="430" width="150" height="58" rx="12" fill="#fff" opacity=".96"/><text x="-20" y="467" font-family="Arial,sans-serif" font-size="29" font-weight="900" fill="#4c2b83" text-anchor="middle">D.A.R.E.</text>
